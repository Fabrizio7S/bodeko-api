spring.application.name=bodeko

spring.config.import=optional:file:.env.dev[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}

spring.flyway.enabled=true


# culqi (pasarela real/sandbox) o mock (simulada, sin cuenta ni servicio externo)
payment.provider=${PAYMENT_PROVIDER:culqi}

culqi.api-url=${CULQI_API_URL:https://api.culqi.com/v2}
culqi.secret-key=${CULQI_SECRET_KEY:}

mail.provider=${MAIL_PROVIDER:log}
mail.from=${MAIL_FROM:Bodeko <onboarding@resend.dev>}
mail.resend.api-url=${RESEND_API_URL:https://api.resend.com}
mail.resend.api-key=${RESEND_API_KEY:}

# Almacenamiento de imágenes: Cloudflare R2 (API S3). En la BD se guarda la ruta relativa;
# la URL pública se arma al responder con storage.r2.public-url.
storage.r2.account-id=${R2_ACCOUNT_ID:}
storage.r2.endpoint=${R2_ENDPOINT:}
storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
storage.r2.bucket=${R2_BUCKET:}
storage.r2.public-url=${R2_PUBLIC_URL:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Rechazar coerciones que cambian el significado de cantidades o estados.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
